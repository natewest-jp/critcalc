<style>
	@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap');

	.cs-root {
		--bg: #111318;
		--card: #181c24;
		--card2: #1e2230;
		--accent-line: rgba(255, 255, 255, 0.06);
		--text: #d4d8e0;
		--muted: rgba(200, 205, 215, 0.38);

		background: var(--bg);
		border-radius: 10px;
		padding: 16px 20px;
		font-family: 'IBM Plex Mono', monospace;
		font-size: 10px;
		color: var(--text);
		overflow-x: auto;
		min-width: 560px;
	}

	.cs-header {
		display: flex;
		align-items: center;
		gap: 8px;
		margin-bottom: 14px;
	}
	.cs-header-dot {
		width: 6px;
		height: 6px;
		border-radius: 50%;
		background: rgba(255, 255, 255, 0.15);
	}
	.cs-header-title {
		font-family: 'Space Grotesk', sans-serif;
		font-size: 10px;
		font-weight: 500;
		letter-spacing: 0.15em;
		text-transform: uppercase;
		color: var(--muted);
	}

	.cs-grid {
		display: grid;
		grid-template-columns: 64px 1fr;
		gap: 0;
	}

	.cs-char-col {
		display: flex;
		flex-direction: column;
	}

	.cs-char-cell {
		height: 54px;
		display: flex;
		align-items: center;
		justify-content: flex-end;
		padding-right: 10px;
		border-bottom: 1px solid var(--accent-line);
	}
	.cs-char-cell.tb {
		height: 38px;
		border-bottom: 2px solid rgba(255, 255, 255, 0.09);
	}

	.cs-avatar {
		width: 30px;
		height: 30px;
		border-radius: 50%;
		display: flex;
		align-items: center;
		justify-content: center;
		font-family: 'Space Grotesk', sans-serif;
		font-size: 9px;
		font-weight: 700;
		border: 1.5px solid;
		letter-spacing: 0.02em;
	}

	.cs-track-col {
		position: relative;
		overflow: hidden;
	}

	.cs-ruler {
		height: 24px;
		position: relative;
		border-bottom: 1px solid var(--accent-line);
	}

	.cs-char-track {
		height: 54px;
		position: relative;
		border-bottom: 1px solid var(--accent-line);
		display: flex;
		flex-direction: column;
		justify-content: center;
		gap: 4px;
		padding: 5px 0;
	}
	.cs-char-track.tb {
		height: 38px;
		border-bottom: 2px solid rgba(255, 255, 255, 0.09);
	}

	.cs-ability-lane {
		height: 18px;
		position: relative;
	}

	.cs-chip {
		position: absolute;
		height: 16px;
		top: 1px;
		display: flex;
		overflow: hidden;
		border-radius: 3px;
		align-items: center;
	}

	.cs-chip-uptime {
		height: 100%;
		display: flex;
		align-items: center;
		padding: 0 5px;
		flex-shrink: 0;
	}

	.cs-chip-lbl {
		font-size: 8.5px;
		font-weight: 500;
		color: rgba(0, 0, 0, 0.75);
		white-space: nowrap;
		font-family: 'IBM Plex Mono', monospace;
	}

	.cs-chip-cd {
		height: 100%;
		display: flex;
		align-items: center;
		padding-left: 4px;
	}

	.cs-chip-cd-text {
		font-size: 8px;
		color: rgba(200, 205, 215, 0.28);
		font-family: 'IBM Plex Mono', monospace;
		white-space: nowrap;
	}

	/* buff band overlays */
	.cs-buff-band {
		position: absolute;
		top: 0;
		bottom: 0;
		pointer-events: none;
		border-left: 1.5px solid;
		z-index: 0;
	}

	/* phase blocks */
	.cs-phase-wrap {
		margin-top: 10px;
	}
	.cs-phase-label {
		font-family: 'Space Grotesk', sans-serif;
		font-size: 8.5px;
		font-weight: 500;
		letter-spacing: 0.12em;
		text-transform: uppercase;
		color: var(--muted);
		margin-bottom: 5px;
		padding-left: 64px;
	}
	.cs-phase-row {
		display: grid;
		grid-template-columns: 64px 1fr;
		gap: 0;
	}
	.cs-phase-tracks {
		position: relative;
		height: 38px;
		display: flex;
		flex-direction: column;
		gap: 3px;
	}
	.cs-phase-strip {
		height: 16px;
		position: relative;
		border-radius: 3px;
		overflow: hidden;
	}

	.cs-legend {
		display: flex;
		gap: 16px;
		margin-top: 12px;
		padding-left: 64px;
		flex-wrap: wrap;
	}
	.cs-legend-item {
		display: flex;
		align-items: center;
		gap: 5px;
		font-size: 8.5px;
		color: var(--muted);
	}
	.cs-legend-swatch {
		width: 16px;
		height: 8px;
		border-radius: 2px;
	}
	.cs-legend-swatch.cd {
		background: rgba(255, 255, 255, 0.06);
		border: 1px solid rgba(255, 255, 255, 0.12);
	}
</style>

<div class="cs-root">
	<div class="cs-header">
		<div class="cs-header-dot"></div>
		<div class="cs-header-dot" style="background: rgba(255, 255, 255, 0.08)"></div>
		<div class="cs-header-dot" style="background: rgba(255, 255, 255, 0.04)"></div>
		<div class="cs-header-title">Rotation Planner — Chip Stack</div>
	</div>

	<div class="cs-grid">
		<div class="cs-char-col" id="char-col"></div>
		<div class="cs-track-col" id="track-col"></div>
	</div>

	<div class="cs-phase-wrap">
		<div class="cs-phase-label">Active Character &amp; Notation</div>
		<div class="cs-phase-row">
			<div
				style="
					height: 38px;
					display: flex;
					align-items: center;
					justify-content: flex-end;
					padding-right: 10px;
				"
			>
				<span
					style="
						font-family: 'Space Grotesk', sans-serif;
						font-size: 8px;
						font-weight: 500;
						letter-spacing: 0.1em;
						text-transform: uppercase;
						color: rgba(200, 205, 215, 0.3);
						text-align: right;
						line-height: 1.3;
					"
					>CHAR<br />FLOW</span
				>
			</div>
			<div class="cs-phase-tracks" id="phase-tracks"></div>
		</div>
	</div>

	<div class="cs-legend">
		<div class="cs-legend-item">
			<div class="cs-legend-swatch" style="background: #e05a4a"></div>
			<span>Uptime</span>
		</div>
		<div class="cs-legend-item">
			<div class="cs-legend-swatch cd"></div>
			<span>Cooldown</span>
		</div>
		<div class="cs-legend-item">
			<div
				style="
					width: 16px;
					height: 8px;
					border-left: 2px solid #6a9aee;
					background: rgba(106, 154, 238, 0.08);
				"
			></div>
			<span>Buff window</span>
		</div>
	</div>
</div>

<script>
	(function () {
		const SCALE = 55;
		const DUR = 18;
		const W = DUR * SCALE;

		const chars = [
			{
				id: 'xl',
				short: 'XL',
				name: 'Xiangling',
				avatarBg: '#1c0a08',
				avatarBorder: '#e05a4a',
				avatarColor: '#e05a4a',
				abilities: [
					{
						label: 'Q',
						start: 0,
						uptime: 10,
						cooldown: 20,
						color: '#e05a4a',
						cdColor: 'rgba(224,90,74,0.1)'
					},
					{
						label: 'E',
						start: 0.3,
						uptime: 2,
						cooldown: 12,
						color: '#c0402a',
						cdColor: 'rgba(192,64,42,0.08)'
					}
				]
			},
			{
				id: 'kz',
				short: 'KZ',
				name: 'Kazuha',
				avatarBg: '#080c1a',
				avatarBorder: '#6a9aee',
				avatarColor: '#6a9aee',
				abilities: [
					{
						label: 'Q',
						start: 0.6,
						uptime: 8,
						cooldown: 15,
						color: '#6a9aee',
						cdColor: 'rgba(106,154,238,0.1)'
					},
					{
						label: 'E',
						start: 0.5,
						uptime: 1,
						cooldown: 6,
						color: '#4a7acc',
						cdColor: 'rgba(74,122,204,0.08)'
					}
				]
			},
			{
				id: 'bn',
				short: 'BN',
				name: 'Bennett',
				avatarBg: '#181200',
				avatarBorder: '#f0c040',
				avatarColor: '#f0c040',
				abilities: [
					{
						label: 'Q',
						start: 1.2,
						uptime: 12,
						cooldown: 15,
						color: '#f0c040',
						cdColor: 'rgba(240,192,64,0.1)'
					},
					{
						label: 'E',
						start: 0.2,
						uptime: 1,
						cooldown: 5,
						color: '#c09020',
						cdColor: 'rgba(192,144,32,0.08)'
					}
				]
			},
			{
				id: 'fc',
				short: 'FC',
				name: 'Fischl',
				avatarBg: '#0e0812',
				avatarBorder: '#c070f0',
				avatarColor: '#c070f0',
				abilities: [
					{
						label: 'Q',
						start: 1.8,
						uptime: 2,
						cooldown: 15,
						color: '#c070f0',
						cdColor: 'rgba(192,112,240,0.1)'
					},
					{
						label: 'E',
						start: 1.5,
						uptime: 10,
						cooldown: 25,
						color: '#9050c0',
						cdColor: 'rgba(144,80,192,0.08)'
					}
				]
			}
		];

		const teamBuffs = [
			{
				label: 'VV 4pc',
				start: 0.7,
				uptime: 10,
				color: 'rgba(80,176,144,0.12)',
				border: '#50b090'
			},
			{
				label: 'BN Q ATK',
				start: 1.2,
				uptime: 12,
				color: 'rgba(240,192,64,0.07)',
				border: '#f0c040'
			},
			{
				label: 'KZ A4 EM',
				start: 0.5,
				uptime: 8,
				color: 'rgba(106,154,238,0.07)',
				border: '#6a9aee'
			}
		];

		const phases = [
			{
				char: 'BN',
				start: 0,
				end: 1.5,
				color: 'rgba(240,192,64,0.2)',
				tc: '#c09020',
				notation: 'BN Q E'
			},
			{
				char: 'KZ',
				start: 1.5,
				end: 3.5,
				color: 'rgba(106,154,238,0.2)',
				tc: '#5a8ad0',
				notation: 'KZ E Q'
			},
			{
				char: 'FC',
				start: 3.5,
				end: 6,
				color: 'rgba(192,112,240,0.18)',
				tc: '#a060c8',
				notation: 'FC Q E'
			},
			{
				char: 'XL',
				start: 6,
				end: 18,
				color: 'rgba(224,90,74,0.2)',
				tc: '#c04030',
				notation: 'XL Q E N1 N2 N3 N4 ...'
			}
		];

		// ── CHAR LABELS ───────────────────────────────────────────────────────────
		const charCol = document.getElementById('char-col');

		// TB label
		const tbCell = document.createElement('div');
		tbCell.className = 'cs-char-cell tb';
		tbCell.innerHTML = `<span style="font-family:'Space Grotesk',sans-serif;font-size:8px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:rgba(200,205,215,0.3);text-align:right;line-height:1.3">TEAM<br>BUFFS</span>`;
		charCol.appendChild(tbCell);

		chars.forEach((c) => {
			const cell = document.createElement('div');
			cell.className = 'cs-char-cell';
			cell.innerHTML = `<div class="cs-avatar" style="background:${c.avatarBg};border-color:${c.avatarBorder};color:${c.avatarColor}">${c.short}</div>`;
			charCol.appendChild(cell);
		});

		// ── TRACKS ────────────────────────────────────────────────────────────────
		const trackCol = document.getElementById('track-col');
		trackCol.style.width = W + 'px';

		// Ruler
		const ruler = document.createElement('div');
		ruler.className = 'cs-ruler';
		for (let t = 0; t <= DUR; t += 2) {
			const tick = document.createElement('div');
			tick.style.cssText = `position:absolute;left:${t * SCALE}px;top:0;width:1px;height:100%;background:rgba(255,255,255,0.06)`;
			const lbl = document.createElement('span');
			lbl.style.cssText = `position:absolute;left:${t * SCALE + 2}px;top:5px;font-size:8.5px;color:rgba(200,205,215,0.3);font-family:'IBM Plex Mono',monospace`;
			lbl.textContent = t + 's';
			ruler.appendChild(tick);
			ruler.appendChild(lbl);
		}
		trackCol.appendChild(ruler);

		// Team buff track
		const tbTrack = document.createElement('div');
		tbTrack.className = 'cs-char-track tb';
		tbTrack.style.justifyContent = 'center';
		tbTrack.style.paddingTop = '4px';
		tbTrack.style.paddingBottom = '4px';

		teamBuffs.forEach((b, i) => {
			const lane = document.createElement('div');
			lane.style.cssText = `height:9px;position:relative;margin-bottom:1px`;
			const fill = document.createElement('div');
			fill.style.cssText = `position:absolute;left:${b.start * SCALE}px;width:${b.uptime * SCALE}px;top:0;height:100%;background:${b.color};border-left:2px solid ${b.border};border-radius:0 2px 2px 0`;
			const lbl = document.createElement('span');
			lbl.style.cssText = `position:absolute;left:${b.start * SCALE + 6}px;top:50%;transform:translateY(-50%);font-size:7.5px;color:${b.border};font-family:'IBM Plex Mono',monospace;white-space:nowrap;font-weight:500`;
			lbl.textContent = b.label;
			lane.appendChild(fill);
			lane.appendChild(lbl);
			tbTrack.appendChild(lane);
		});
		trackCol.appendChild(tbTrack);

		// Char tracks
		chars.forEach((c) => {
			const track = document.createElement('div');
			track.className = 'cs-char-track';

			// Add buff bands as bg overlays
			teamBuffs.forEach((b) => {
				const band = document.createElement('div');
				band.style.cssText = `position:absolute;left:${b.start * SCALE}px;width:${b.uptime * SCALE}px;top:0;bottom:0;background:${b.color};border-left:1px solid ${b.border};pointer-events:none;opacity:0.5;z-index:0`;
				track.appendChild(band);
			});

			// Grid lines
			for (let t = 2; t < DUR; t += 2) {
				const gl = document.createElement('div');
				gl.style.cssText = `position:absolute;left:${t * SCALE}px;top:0;bottom:0;width:1px;background:rgba(255,255,255,0.025);pointer-events:none;z-index:0`;
				track.appendChild(gl);
			}

			c.abilities.forEach((ab) => {
				const lane = document.createElement('div');
				lane.className = 'cs-ability-lane';
				lane.style.zIndex = '1';

				const totalW = Math.min(ab.cooldown * SCALE, W - ab.start * SCALE);
				const chip = document.createElement('div');
				chip.className = 'cs-chip';
				chip.style.left = `${ab.start * SCALE}px`;
				chip.style.width = `${totalW}px`;

				// uptime
				const uptimeDiv = document.createElement('div');
				uptimeDiv.className = 'cs-chip-uptime';
				uptimeDiv.style.cssText = `background:${ab.color};width:${ab.uptime * SCALE}px;min-width:${ab.uptime * SCALE}px`;

				const lbl = document.createElement('span');
				lbl.className = 'cs-chip-lbl';
				lbl.textContent = ab.label;
				uptimeDiv.appendChild(lbl);
				chip.appendChild(uptimeDiv);

				// cooldown portion
				const cdW = totalW - ab.uptime * SCALE;
				if (cdW > 0) {
					const cdDiv = document.createElement('div');
					cdDiv.className = 'cs-chip-cd';
					cdDiv.style.cssText = `background:${ab.cdColor};width:${cdW}px;border:1px solid rgba(255,255,255,0.06);border-left:none;border-radius:0 3px 3px 0`;
					if (cdW > 28) {
						const cdTxt = document.createElement('span');
						cdTxt.className = 'cs-chip-cd-text';
						cdTxt.textContent = `${ab.cooldown}s`;
						cdDiv.appendChild(cdTxt);
					}
					chip.appendChild(cdDiv);
				}

				lane.appendChild(chip);
				track.appendChild(lane);
			});

			trackCol.appendChild(track);
		});

		// ── PHASE TRACKS ──────────────────────────────────────────────────────────
		const phaseTracks = document.getElementById('phase-tracks');
		phaseTracks.style.width = W + 'px';

		// Strip 1: active char color band
		const strip1 = document.createElement('div');
		strip1.className = 'cs-phase-strip';
		strip1.style.background = 'rgba(255,255,255,0.03)';

		phases.forEach((p) => {
			const seg = document.createElement('div');
			seg.style.cssText = `position:absolute;left:${p.start * SCALE}px;width:${(p.end - p.start) * SCALE}px;top:0;height:100%;background:${p.color};display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(0,0,0,0.2)`;
			const txt = document.createElement('span');
			txt.style.cssText = `font-family:'Space Grotesk',sans-serif;font-size:8px;font-weight:700;letter-spacing:0.1em;color:${p.tc}`;
			txt.textContent = p.char;
			seg.appendChild(txt);
			strip1.appendChild(seg);
		});
		phaseTracks.appendChild(strip1);

		// Strip 2: notation
		const strip2 = document.createElement('div');
		strip2.className = 'cs-phase-strip';
		strip2.style.cssText = `height:16px;position:relative;background:rgba(255,255,255,0.015)`;

		phases.forEach((p) => {
			const seg = document.createElement('div');
			seg.style.cssText = `position:absolute;left:${p.start * SCALE + 3}px;top:50%;transform:translateY(-50%);font-size:7.5px;color:${p.tc};font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;max-width:${(p.end - p.start) * SCALE - 6}px`;
			seg.textContent = p.notation;
			strip2.appendChild(seg);
		});
		phaseTracks.appendChild(strip2);
	})();
</script>
